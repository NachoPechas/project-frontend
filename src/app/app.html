<div class="role-tester-panel">
  <div class="panel-header">🧪 Probador de Roles</div>
  <div class="btn-group">
    <button 
      [class.active]="authService.isStudent()" 
      (click)="authService.switchRole('student')"
    >
      👤 Estudiante
    </button>
    <button 
      [class.active]="authService.isAdmin()" 
      (click)="authService.switchRole('admin')"
    >
      🛡️ Admin
    </button>
  </div>
  <div class="role-status">
    Rol actual: <strong style="text-transform:uppercase">{{ authService.currentUserRole() }}</strong>
  </div>
</div>
